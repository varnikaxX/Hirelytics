<head>
    <style> 
    body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: #cce55d;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    text-align: center;
    width: 300px;
}

h2 { color: #333; margin-top: 0; }

#probability-score {
    font-size: 48px;
    font-weight: bold;
    color: #764ba2; /* Your primary purple */
    margin: 20px 0;
}

.btn {
    display: inline-block;
    padding: 10px 20px;
    background-color: #764ba2;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-size: 14px;
    transition: background 0.2s;
}

.btn:hover { background-color: #3a04048e; }
</style>
</head>




<div class="result-container">
    <h1>Your Placement Probability</h1>
    <div id="probability-score" style="font-size: 3rem; font-weight: bold; color: #764ba2;">
        --%
    </div>
    <p id="message"></p>
    <button onclick="window.location.href='index.html'">Test Again</button>
</div>
<style>
    /*pop effect*/
@keyframes popIn {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}

#probability-score {
    animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: inline-block;
}
</style>
<script>
    // 1. Get the value from Session Storage
    const prob = sessionStorage.getItem('placement_prob');

    if (prob) {
        // 2. Display the percentage
        document.getElementById('probability-score').innerText = prob + "%";
        
        // 3. Add a custom message
        const messageEl = document.getElementById('message');
        if (parseFloat(prob) > 70) {
            messageEl.innerText = "Excellent! You have a high chance of being placed.";
            messageEl.style.color = "green";
        } else if (parseFloat(prob) > 40) {
            messageEl.innerText = "Good, but there's room for improvement.";
            messageEl.style.color = "orange";
        } else {
            messageEl.innerText = "Focus on more projects and workshops to improve your score.";
            messageEl.style.color = "red";
        }
    } else {
        // Redirect back if someone tries to access result.html directly
        window.location.href = "index.html";
    }

</script>
